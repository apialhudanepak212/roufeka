<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17251f">
  <meta name="description" content="Undangan pernikahan Muhammad Roúf dan Eka Kalista Nur Agustin, 22 November 2026.">
  <title>Rouf & Eka — Undangan Pernikahan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    /* Definisi Custom Font Aston Script */
    @font-face {
      font-family: 'AstonScript';
      src: url('astonscript.ttf') format('truetype');
      font-weight: bold;
      font-style: normal;
    }

    /* Definisi Custom Font Jawa Palsu */
    @font-face {
      font-family: 'JawaPalsu';
      src: url('jawapalsu.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --forest: #17251f;
      --forest-soft: #23372e;
      --gold: #c6a66a;
      --gold-light: #e7d6ae;
      --cream: #f7f3ea;
      --ink: #26352d;
      --muted: #d6d2c8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100vh;
      height: 100svh;
      background: #111;
      color: var(--cream);
      font-family: "DM Sans", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    button { font: inherit; }

    /* Kontainer utama berukuran rasio 9:16 persis dan pas di layar tanpa scroll */
    .invitation {
      position: relative;
      isolation: isolate;
      width: 100%;
      max-width: 410px;
      height: 100vh;
      max-height: 730px;
      aspect-ratio: 9 / 16;
      overflow: hidden;
      background: var(--forest);
      box-shadow: 0 20px 50px rgba(0,0,0,0.7);
    }

    /* Layer Background Utama */
    .invitation::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background: url("background.png") center / cover no-repeat;
      transition: filter 0.8s ease, transform 0.8s ease;
    }

    /* Efek Gelap & Blur pada Background saat Halaman Kedua Dibuka */
    .invitation.opened::before {
      filter: blur(8px) brightness(0.4);
      transform: scale(1.05);
    }

    .grain {
      position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: .14;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E");
    }

    .cover, .details { 
      position: absolute; 
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* Cover / Halaman Pertama (9:16, No Scroll) */
    .cover {
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center;
      padding: 30px 20px;
      text-align: center;
      transition: opacity .5s ease, transform .5s ease, visibility .5s;
    }

    .cover.hidden {
      opacity: 0;
      visibility: hidden;
      transform: scale(0.95);
      pointer-events: none;
    }

    .cover-main { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      width: 100%;
    }
    
    .names {
      margin: 10px 0;
      color: #54370E;
      font-family: "AstonScript", cursive;
      font-weight: bold;
      font-size: clamp(3rem, 12vw, 4.8rem);
      line-height: 1.1;
      text-shadow: none;
    }
    .names .and { 
      display: block; 
      margin: 6px 0; 
      font-family: "Cormorant Garamond", serif; 
      font-size: 1.35rem; 
      font-style: italic; 
      color: #54370E; 
    }
    
    .date { 
      color: #54370E; 
      font-family: "Cormorant Garamond", serif; 
      font-size: 1.15rem; 
      letter-spacing: .2em; 
      margin: 30px 0 18px 0; 
      font-weight: 600;
    }

    .open-button {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      min-height: 44px; padding: 0 26px;
      border: 1px solid var(--gold); border-radius: 999px;
      color: var(--forest); background: linear-gradient(135deg, #e7d6ae, #c6a66a);
      font-size: .72rem; font-weight: 700; letter-spacing: .12em;
      cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,0.2);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .open-button:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    .open-button:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    
    /* --- HALAMAN KEDUA (DETAIL / SESUAI GAMBAR REFERENSI) --- */
    .details {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 20px;
      text-align: center;
      opacity: 0;
      visibility: hidden;
      transform: scale(1.05);
      transition: opacity .6s ease, transform .6s ease, visibility .6s;
      overflow: hidden;
      /* Background coklat transparan sesuai permintaan */
      background: rgba(75, 45, 20, 0.45);
    }

    .details.visible {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
    }

    .top-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .gunungan-img { 
      display: block; 
      width: 38px; 
      max-height: 50px; 
      object-fit: contain; 
      margin-bottom: 6px; 
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); 
    }

    .wedding-invitation-title {
      color: #e7d6ae;
      font-family: "Cormorant Garamond", serif;
      font-size: 0.85rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      position: relative;
      width: 100%;
      padding-bottom: 10px;
    }

    .wedding-invitation-title::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 20%;
      right: 20%;
      height: 1px;
      background: rgba(198, 166, 106, 0.5);
    }

    .wayang-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin: 10px 0;
    }

    .wayang-img {
      max-width: 85%;
      max-height: 330px;
      object-fit: contain;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
    }
    
    /* Textbox Coklat Mempelai di Bawah */
    .couple-textbox {
      width: 100%;
      background: rgba(70, 38, 16, 0.85);
      border: 1px solid rgba(198, 166, 106, 0.6);
      border-radius: 12px;
      padding: 16px 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      backdrop-filter: blur(4px);
      margin-bottom: 10px;
    }

    .couple-names-aston {
      color: #f7f3ea;
      font-family: "AstonScript", cursive;
      font-size: clamp(2.4rem, 9vw, 3.2rem);
      line-height: 1.1;
      font-weight: bold;
    }

    .couple-date-sub {
      color: #e7d6ae;
      font-family: "Cormorant Garamond", serif;
      font-size: 0.95rem;
      letter-spacing: 0.25em;
      margin-top: 8px;
      position: relative;
      padding-top: 6px;
    }

    .couple-date-sub::before {
      content: "";
      position: absolute;
      top: 0;
      left: 30%;
      right: 30%;
      height: 1px;
      background: rgba(198, 166, 106, 0.4);
    }

    .back-button { 
      background: none; 
      border: none; 
      color: rgba(231, 214, 174, 0.7); 
      font-size: 0.65rem; 
      cursor: pointer; 
      letter-spacing: 0.1em;
      transition: color 0.2s;
    }
    .back-button:hover { color: #f7f3ea; }
  </style>
</head>
<body>
  <main class="invitation" id="invitation">
    <div class="grain" aria-hidden="true"></div>
    
    <!-- HALAMAN PERTAMA (COVER) -->
    <section class="cover" id="cover" aria-label="Sampul undangan">
      <div></div>
      <div class="cover-main">
        <h1 class="names">Rouf <span class="and">dan</span> Eka</h1>
        <p class="date">22 · 11 · 2026</p>
        <button class="open-button" id="openInvitation" type="button">
          <span aria-hidden="true">✧</span> BUKA UNDANGAN <span aria-hidden="true">↗</span>
        </button>
      </div>
      <div></div>
    </section>

    <!-- HALAMAN KEDUA (DETAIL SESUAI GAMBAR REFERENSI) -->
    <section class="details" id="details" aria-label="Detail mempelai" aria-hidden="true">
      <div class="top-section">
        <img src="gunungan.png" alt="Ornamen gunungan wayang" class="gunungan-img" onerror="this.style.display='none'">
        <h2 class="wedding-invitation-title">WEDDING INVITATION</h2>
      </div>
      
      <div class="wayang-container">
        <img src="wayang.png" alt="Ilustrasi Wayang" class="wayang-img" onerror="this.style.display='none'">
      </div>

      <div class="couple-textbox">
        <h3 class="couple-names-aston">Rouf & Eka</h3>
        <p class="couple-date-sub">22.11.2026</p>
      </div>

      <button class="back-button" id="backToCover" type="button">← Kembali ke sampul</button>
    </section>
  </main>
  
  <script>
    const invitation = document.getElementById("invitation");
    const cover = document.getElementById("cover");
    const details = document.getElementById("details");
    const openButton = document.getElementById("openInvitation");
    const backButton = document.getElementById("backToCover");

    openButton.addEventListener("click", () => {
      invitation.classList.add("opened");
      cover.classList.add("hidden");
      details.classList.add("visible");
      details.setAttribute("aria-hidden", "false");
    });

    backButton.addEventListener("click", () => {
      invitation.classList.remove("opened");
      details.classList.remove("visible");
      details.setAttribute("aria-hidden", "true");
      cover.classList.remove("hidden");
    });
  </script>
</body>
</html>
